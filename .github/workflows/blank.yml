name: Update M365 IP ranges
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and flatten M365 endpoints
        run: |
          GUID=$(cat /proc/sys/kernel/random/uuid)
          LATEST=$(curl -s "https://endpoints.office.com/version/worldwide?clientrequestid=$GUID" | jq -r '.latest')
          CURRENT=$(cat version.txt 2>/dev/null || echo "0")

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "No change (version $CURRENT)"
            exit 0
          fi

          curl -s "https://endpoints.office.com/endpoints/worldwide?clientrequestid=$GUID&NoIPv6=true" \
            | jq -r '
                ["IPRange","ServiceArea","Category","Required","ID"],
                (.[] | select(.ips) | . as $e | $e.ips[] |
                  [., $e.serviceArea, $e.category, ($e.required|tostring), ($e.id|tostring)])
                | @csv' > m365_ips.csv

          echo "$LATEST" > version.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add m365_ips.csv version.txt
          git diff --staged --quiet || git commit -m "Update M365 IPs to $(cat version.txt)"
          git push
